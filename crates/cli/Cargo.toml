[package]
name = "threeterm-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Headless Automation CLI adapter for the ThreeTerm domain command API."

[dependencies]
serde_json = { workspace = true }
threeterm-domain = { path = "../domain" }
threeterm-host = { path = "../host" }
threeterm-occt-worker = { path = "../workers/occt" }
threeterm-persistence = { path = "../persistence" }
threeterm-protocol = { path = "../protocol" }

[dev-dependencies]
threeterm-persistence = { path = "../persistence", features = ["publication-kill-points"] }

[[bin]]
name = "threeterm"
path = "src/main.rs"

[lints]
workspace = true
