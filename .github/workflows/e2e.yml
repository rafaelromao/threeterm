name: native-e2e

on:
  workflow_dispatch:
    inputs:
      expected_catalog_result:
        description: "Expected acceptance catalog result for this checkout"
        required: false
        default: failed
        type: choice
        options:
          - failed
          - passed
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  native-e2e:
    name: Native worker end-to-end checks
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PODMAN_ROOTLESS: "1"
      THREETERM_EXPECTED_ACCEPTANCE_RESULT: ${{ inputs.expected_catalog_result || 'failed' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Podman (rootless)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              podman uidmap fuse-overlayfs slirp4netns
          podman --version

      - name: Verify Podman is configured for rootless
        run: |
          set -euo pipefail
          if ! podman info --format '{{.Host.Security.Rootless}}' | grep -qi '^true$'; then
              echo "ERROR: podman is not running rootless" >&2
              podman info >&2
              exit 1
          fi

      - name: Run acceptance catalog in Arch container
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.cargo"
          set +e
          podman run --rm \
              --security-opt label=disable \
              -v "${PWD}:/workspace" \
              -v "${HOME}/.cargo:/root/.cargo" \
              -w /workspace \
              -e "THREETERM_EXPECTED_ACCEPTANCE_RESULT=${THREETERM_EXPECTED_ACCEPTANCE_RESULT}" \
              docker.io/archlinux@sha256:b860afd5823683f7ea389ba5f00d812f4fe55f6f286dea329d2abeefa535e309 \
              bash -lc '
                set -euo pipefail
                channel="$(tr -d "[:space:]" < rust-toolchain-channel.txt)"
                if ! command -v rustc >/dev/null 2>&1; then
                  pacman -Syu --noconfirm rustup gcc
                fi
                if ! command -v cc >/dev/null 2>&1; then
                  pacman -Syu --noconfirm gcc
                fi
                pacman -Syu --noconfirm --needed base-devel cmake git curl jq freetype2 fontconfig libx11
                if ! rustup toolchain list 2>/dev/null | grep -q "^${channel}"; then
                  rustup toolchain install "${channel}" \
                    --profile minimal --component rustfmt --component clippy
                fi
                rustup default "${channel}" >/dev/null
                bash /workspace/.github/scripts/acceptance.sh
              '
          acceptance_status=$?
          set -e
          if [[ "${THREETERM_EXPECTED_ACCEPTANCE_RESULT}" == passed ]]; then
            test "${acceptance_status}" -eq 0
          else
            test "${acceptance_status}" -ne 0
          fi

      - name: Validate acceptance catalog
        run: |
          set -euo pipefail
          test -s target/acceptance-catalog.json
          expected_commit="$(git rev-parse HEAD)"
          jq -e --arg commit "${expected_commit}" \
            --arg expected_result "${THREETERM_EXPECTED_ACCEPTANCE_RESULT}" '
            .schema_version == "threeterm.acceptance.catalog/1" and
            .source.commit == $commit and
            .source.changed_during_run == false and
            .evidence.complete == true and
            .result == $expected_result and
            ([.gates[].id] == ["source-integrity", "worker.native", "baseline",
              "workflow.l-bracket", "workflow.box-with-lid", "workflow.reusable-component",
              "workflow.historical-edit", "workflow.object-timeline", "workflow.keyboard-first",
              "workflow.invalid-edit-recovery", "replay.canonical-extrude", "registry.command-schemas",
              "schema.identities", "licensing.libslvs", "release.namespace",
              "documentation.workspace", "performance.claims"]) and
            (if $expected_result == "passed" then
               (.gates | all(.status == "passed" and .timed_out == false))
             else
               (.gates | all(if .id == "release.namespace" then
                              .status == "failed" and .timed_out == false
                            else
                              .status == "passed" and .timed_out == false
                            end))
             end) and
            (.artifacts | length > 0) and
            (.artifacts | all((.bytes | type == "number") and
                              (.sha256 | test("^[0-9a-f]{64}$"))))
          ' target/acceptance-catalog.json

      - name: Upload native-worker execution manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-worker-manifest
          path: |
            target/acceptance-catalog.json
            target/acceptance-run/logs
            target/acceptance-run/native-worker-manifest.json
            target/acceptance-run/libslvs-artifact
          if-no-files-found: error
