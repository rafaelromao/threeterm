name: rehearsal-evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Generate production rehearsal evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PODMAN_ROOTLESS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Podman (rootless)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman uidmap fuse-overlayfs slirp4netns
          podman info --format '{{.Host.Security.Rootless}}'

      - name: Generate evidence in the pinned Arch environment
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/rehearsal-evidence"
          podman run --rm \
              --security-opt label=disable \
              -v "${PWD}:/workspace" \
              -v "${RUNNER_TEMP}/rehearsal-evidence:/evidence" \
              -w /workspace \
              docker.io/archlinux:latest \
              bash -lc '
                set -euo pipefail
                pacman -Syu --noconfirm rustup gcc opencascade
                channel="$(tr -d "[:space:]" < rust-toolchain-channel.txt)"
                rustup toolchain install "${channel}" --profile minimal
                rustup default "${channel}"
                cargo run -p threeterm-cli --bin threeterm -- \
                  --machine rehearse \
                  --output-dir /evidence/l-bracket \
                  --release-candidate rc-1
              '

      - name: Upload generated evidence
        uses: actions/upload-artifact@v4
        with:
          name: rehearsal-evidence-l-bracket
          path: ${{ runner.temp }}/rehearsal-evidence/l-bracket
          if-no-files-found: error
