[package]
name = "threeterm-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Keyboard-first TUI adapter for the ThreeTerm domain command API."

[dependencies]
nix = { version = "0.31", features = ["poll"] }
serde = { workspace = true }
serde_json = { workspace = true }
threeterm-host = { path = "../host" }
threeterm-domain = { path = "../domain" }
threeterm-protocol = { path = "../protocol" }
threeterm-theme = { path = "../theme" }
threeterm-viewport = { path = "../viewport" }

[dev-dependencies]
threeterm-persistence = { path = "../persistence" }
threeterm-occt-worker = { path = "../workers/occt" }

[lints]
workspace = true
