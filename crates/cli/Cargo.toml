[package]
name = "threeterm-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Headless Automation CLI adapter for the ThreeTerm domain command API."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
threeterm-domain = { path = "../domain" }
threeterm-host = { path = "../host" }
threeterm-lua-bridge = { path = "../lua-bridge" }
threeterm-occt-worker = { path = "../workers/occt" }
threeterm-slvs-worker = { path = "../workers/slvs" }
threeterm-persistence = { path = "../persistence" }
threeterm-protocol = { path = "../protocol" }
threeterm-theme = { path = "../theme" }
threeterm-tui = { path = "../tui" }
threeterm-viewport = { path = "../viewport" }

[dev-dependencies]
threeterm-persistence = { path = "../persistence", features = ["publication-kill-points"] }
threeterm-slvs-worker = { path = "../workers/slvs" }

[[bin]]
name = "threeterm"
path = "src/main.rs"

[lints]
workspace = true
